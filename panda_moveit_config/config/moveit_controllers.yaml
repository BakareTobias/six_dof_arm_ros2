# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - gripper_controller

  arm_controller:
    type: FollowJointTrajectory
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    action_ns: follow_joint_trajectory
    default: true

  gripper_controller:
    type: FollowJointTrajectory
    joints:
      - panda_finger_joint1
      - panda_finger_joint2
    action_ns: follow_joint_trajectory
    default: true

trajectory_execution:
  allowed_execution_duration_scaling: 80.0 # Increase this to allow more time for execution, especially in simulation. Raised extra high for my slow computer, but can be reduced for better performance on faster machines.
  allowed_goal_duration_margin: 5.0
  allowed_start_tolerance: 0.01